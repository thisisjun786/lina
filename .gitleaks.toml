title = "Lina secret scanning"
minVersion = "v8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "RFC6455 public WebSocket example nonce in the handshake test"
condition = "AND"
paths = ['''^packages/lina-web/test/server\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']
