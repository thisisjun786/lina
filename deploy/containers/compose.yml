services:
  lina:
    build:
      context: ../..
      dockerfile: deploy/containers/Dockerfile
    init: true
    ports:
      - "127.0.0.1:7980:7980"
    volumes:
      - lina-data:/home/bun/.lina
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    environment:
      LINA_OPENCODEX_BASE_URL: ${LINA_OPENCODEX_BASE_URL:-}
volumes:
  lina-data:
