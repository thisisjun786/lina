name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reject-main-pr:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Close development PR targeting the release mirror
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr close "$PR_NUMBER"

  selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      docs: ${{ steps.scope.outputs.docs }}
      automation: ${{ steps.scope.outputs.automation }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          node .github/scripts/ci-scope.mjs \
            --base "$BASE_SHA" --head "$GITHUB_SHA" \
            --event "$GITHUB_EVENT_NAME" --base-ref "$BASE_REF"
      - name: Check change whitespace
        env:
          BASE_SHA: ${{ fromJSON(steps.scope.outputs.scope).base }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            git diff --check "$BASE_SHA" "$GITHUB_SHA"
          else
            git show --format= --check "$GITHUB_SHA"
          fi

  docs:
    needs: selection
    if: needs.selection.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check local document link targets
        run: node .github/scripts/check-docs.mjs

  automation:
    needs: selection
    if: needs.selection.outputs.automation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check script syntax and behavioral contracts
        run: |
          for file in .github/scripts/*.mjs; do node --check "$file"; done
          node --test .github/scripts/*.test.mjs
      - name: Restore actionlint archive
        id: actionlint-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/actionlint.tar.gz
          key: actionlint-${{ runner.os }}-${{ runner.arch }}-v1.7.12-${{ env.ACTIONLINT_SHA256 }}
      - name: Validate workflows
        run: |
          if [[ "${{ steps.actionlint-cache.outputs.cache-hit }}" != 'true' ]]; then
            curl --fail --silent --show-error --location "$ACTIONLINT_URL" -o "$RUNNER_TEMP/actionlint.tar.gz"
          fi
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  foundation:
    name: foundation
    needs: [selection, docs, automation]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require every selected check to succeed
        env:
          CI_SCOPE: ${{ needs.selection.outputs.scope }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-gate.mjs
