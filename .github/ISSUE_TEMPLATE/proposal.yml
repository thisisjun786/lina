name: Feature or design proposal
description: Describe a problem worth solving and the outcome you want.
body:
  - type: markdown
    attributes:
      value: Write the title and body in English.
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe who is affected and what is difficult or missing today.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a good outcome look like?
      description: Explain what the user could do and how we would know the change helped.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Approaches and constraints
      description: Optional alternatives, trade-offs, related issues, or design references. You do not need to propose an implementation.
