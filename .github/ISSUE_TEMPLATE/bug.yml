name: Bug report
description: Report a problem with behavior, documentation, or configuration.
body:
  - type: markdown
    attributes:
      value: |
        Write the title and body in English.

        Search existing issues first. For sensitive findings, follow [Security](https://github.com/thisisjun786/lina/blob/main/SECURITY.md) instead of posting details here.
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the actual result and how it affects you.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Give the smallest steps or example. If it is intermittent or you cannot reproduce it, say so.
      placeholder: |
        1. Start with...
        2. Do...
        3. Observe...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: Commit or tag, OS, and affected component, if known or relevant.
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Add relevant links, screenshots, or sanitized logs. Remove secrets and personal data.
