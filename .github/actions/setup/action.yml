name: Set up Lina
description: Install the repository Bun version and optional locked dependencies.
inputs:
  install:
    description: Install application dependencies; false for selection and aggregation.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: .bun-version
    - name: Install locked dependencies
      if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts
